function initLoopCarousel(id,kind){
 const el=document.getElementById(id),data=carouselData[kind],track=el.querySelector('.loop-track'),dots=el.querySelector('.loop-dots');
 let current=1,locked=false,startX=0,timer;

 track.innerHTML=slides.map(item=>`<button class="loop-slide" data-demo="${kind}" aria-label="${item[1]}"><img src="assets/hyundai-demo/${item[0]}" alt="${item[1]}"><span class="loop-caption">${item[3]?`<em>${item[3]}</em>`:''}<strong>${item[1]}</strong><small>${item[2]}</small></span></button>`).join('');
 const pagination=makeSlidingPagination(dots,data.length,'', 'Слайд');
 const duration=()=>motionReduced.matches?0:SLIDE_MS;
 function finish(){if(current===data.length+1){current=1;track.style.transition='none';track.style.transform=`translateX(-${current*100}%)`;track.getBoundingClientRect();track.style.removeProperty('transition')}
 else if(current===0){current=data.length;track.style.transition='none';track.style.transform=`translateX(-${current*100}%)`;track.getBoundingClientRect();track.style.removeProperty('transition')}
 locked=false;}
 function move(n,animated=true){if(locked||n===current)return;locked=animated&&duration()>0;current=n;
 track.style.transition=animated?'':'none';track.style.transform=`translateX(-${current*100}%)`;
 pagination.update((current-1+data.length)%data.length,!animated);
 clearTimeout(timer);timer=setTimeout(finish,duration()+20);}
 track.style.transition='none';track.style.transform='translateX(-100%)';pagination.update(0,true);

 let sx=0,sy=0;root.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});root.addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(root.querySelector('.dd-zoom-surface')?.dataset.zoomed==='true'||root.querySelector('.dd-zoom-surface')?.dataset.pinching==='true')return;if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy))moveFullGallery(dx<0?1:-1);else if(dy>110&&Math.abs(dy)>Math.abs(dx)*1.4)closeFullGallery()},{passive:true});

async function shareGalleryImage(src){try{const response=await fetch(src);if(!response.ok)throw Error('image');const blob=await response.blob();const file=new File([blob],'hyundai-photo.'+(blob.type.includes('png')?'png':'jpg'),{type:blob.type||'image/jpeg'});if(navigator.canShare?.({files:[file]})){await navigator.share({files:[file],title:'Hyundai '+cars[model][0]});return}if(navigator.share){await navigator.share({title:'Hyundai '+cars[model][0],url:new URL(src,location.href).href});return}const link=document.createElement('a');link.href=src;link.download=file.name;link.click();toast('Фото сохранено или открыто для скачивания')}catch(e){if(e.name!=='AbortError')toast('Не удалось поделиться фотографией')}}

/* v120: ZoomableImage parity — pinch 1–4x, double-tap 2.5x, clamped pan. */
function installGalleryZoom(root){
 const surface=root.querySelector('.dd-zoom-surface'),photo=root.querySelector('#dd-gallery-image');
 let scale=1,ox=0,oy=0,lastTap=0,drag=null,pinch=null;
 const points=new Map();
 const clamp=()=>{const r=surface.getBoundingClientRect();ox=Math.max(-r.width*(scale-1)/2,Math.min(r.width*(scale-1)/2,ox));oy=Math.max(-r.height*(scale-1)/2,Math.min(r.height*(scale-1)/2,oy));};
 const draw=()=>{clamp();photo.style.transform=`translate(${ox}px,${oy}px) scale(${scale})`;surface.dataset.zoomed=String(scale>1.01);};
 const reset=()=>{scale=1;ox=oy=0;drag=pinch=null;points.clear();draw();};root.ddResetZoom=reset;
 const distance=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
 surface.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button!==0)return;points.set(e.pointerId,{x:e.clientX,y:e.clientY});surface.setPointerCapture?.(e.pointerId);if(points.size===2){const v=[...points.values()];pinch={distance:distance(v[0],v[1]),scale};surface.dataset.pinching='true';drag=null}else if(scale>1.01){drag={x:e.clientX,y:e.clientY,ox,oy}}});
 surface.addEventListener('pointermove',e=>{if(!points.has(e.pointerId))return;points.set(e.pointerId,{x:e.clientX,y:e.clientY});if(points.size===2&&pinch){const v=[...points.values()];scale=Math.min(4,Math.max(1,pinch.scale*distance(v[0],v[1])/Math.max(1,pinch.distance)));if(scale<=1.01)ox=oy=0;draw()}else if(points.size===1&&drag&&scale>1.01){ox=drag.ox+e.clientX-drag.x;oy=drag.oy+e.clientY-drag.y;draw()}});
 const end=e=>{points.delete(e.pointerId);drag=null;if(points.size<2){pinch=null;setTimeout(()=>surface.dataset.pinching='false',80)}if(scale<1.05){scale=1;ox=oy=0;draw()}};
 surface.addEventListener('pointerup',end);surface.addEventListener('pointercancel',end);
 surface.addEventListener('dblclick',e=>{e.preventDefault();scale=scale>1.5?1:2.5;ox=oy=0;draw()});
 surface.addEventListener('touchend',e=>{if(e.changedTouches.length!==1||e.touches.length)return;const now=Date.now();if(now-lastTap<320){e.preventDefault();scale=scale>1.5?1:2.5;ox=oy=0;draw();lastTap=0}else lastTap=now},{passive:false});
 surface.addEventListener('wheel',e=>{if(!e.ctrlKey&&!e.metaKey)return;e.preventDefault();scale=Math.max(1,Math.min(4,scale*(e.deltaY<0?1.12:.89)));if(scale===1)ox=oy=0;draw()},{passive:false});
 draw();
}

function renderFullGallery(){if(!galleryState)return;const imgs=galleryImages();const root=document.querySelector('.dd-full-gallery');if(!root)return;root.querySelector('#dd-gallery-count').textContent=`${galleryState.index+1}/${imgs.length}`;root.querySelector('#dd-gallery-image').src=img(imgs[galleryState.index]);root.ddResetZoom?.();root.querySelectorAll('[data-gallery-category]').forEach(b=>b.classList.toggle('active',+b.dataset.galleryCategory===galleryState.category));root.querySelector('#dd-gallery-thumbs').innerHTML=imgs.map((name,i)=>`<button class="${i===galleryState.index?'active':''}" data-gallery-index="${i}" aria-label="Фото ${i+1}"><img src="${img(name)}" alt=""></button>`).join('');root.querySelector('[data-gallery-index="'+galleryState.index+'"]').scrollIntoView({block:'nearest',inline:'nearest',behavior:'smooth'})}
function moveFullGallery(dir){if(!galleryState)return;galleryState.index=(galleryState.index+dir+galleryImages().length)%galleryImages().length;renderFullGallery()}
function closeFullGallery(){document.querySelector('.dd-full-gallery')?.remove();galleryState=null;document.removeEventListener('keydown',galleryKeyHandler)}
function galleryKeyHandler(e){if(e.key==='Escape')closeFullGallery();if(e.key==='ArrowRight')moveFullGallery(1);if(e.key==='ArrowLeft')moveFullGallery(-1)}

function openMapsSheet(){const o=orders[activeOrderIndex];if(!o)return;const address=[o.city,o.address].filter(Boolean).join(', ');const q=encodeURIComponent(address);const root=document.createElement('div');root.className='dd-delete-overlay';root.innerHTML=`<div class="dd-delete-sheet" role="dialog" aria-modal="true"><h2>Открыть в картах</h2><p>${escape(address)}</p><a class="v119-map-link" target="_blank" rel="noopener noreferrer" href="https://maps.apple.com/?q=${q}">Apple Maps ↗</a><a class="v119-map-link" target="_blank" rel="noopener noreferrer" href="https://yandex.ru/maps/?text=${q}">Яндекс.Карты ↗</a><a class="v119-map-link" target="_blank" rel="noopener noreferrer" href="https://2gis.ru/search/${q}">2ГИС ↗</a><button class="dd-text-action" data-close-maps>Отмена</button></div>`;document.querySelector('#app').append(root);root.addEventListener('click',e=>{if(e.target===root||e.target.closest('[data-close-maps]')||e.target.closest('.v119-map-link'))root.remove()})}
function toast(t){document.querySelector('.demo-toast')?.remove();const d=document.createElement('div');d.className='demo-toast';d.textContent=t;document.body.append(d);setTimeout(()=>d.remove(),2700)}
document.addEventListener('click',e=>{const setting=e.target.closest('[data-setting]');if(!setting)return;const action=setting.dataset.setting;if(action==='theme'){darkProfile=!darkProfile;localStorage.setItem('app_theme',darkProfile?'dark':'light');applyAppTheme();navigate(route==='settings'?'settings':'profile',{},false)}else if(action==='person')navigate('editProfile');else if(action==='logout')toast('В демоверсии авторизация не подключена');else if(action==='language')toast('Язык демонстрации: русский');else toast('Раздел доступен в демонстрационном режиме без подключения сервера')});
document.addEventListener('change',e=>{const status=e.target.closest('[data-crm-status]');if(!status)return;const i=Number(status.dataset.crmStatus);updateOrderStatus(i,status.value)});
document.addEventListener('click',e=>{if(e.target.closest('[data-model-sort]')){const menu=document.querySelector('.dd-model-sort-options');if(menu)menu.hidden=!menu.hidden;document.querySelector('.dd-catalog-categories')?.setAttribute('hidden','');return}const categoryToggle=e.target.closest('[data-catalog-filters]');if(categoryToggle){const menu=document.querySelector('.dd-catalog-categories');if(menu)menu.hidden=!menu.hidden;document.querySelector('.dd-model-sort-options')?.setAttribute('hidden','');return}const sort=e.target.closest('[data-model-sort-value]');if(sort){modelSort=sort.dataset.modelSortValue;document.querySelector('.dd-model-sort-options').hidden=true;refreshModelResults();return}if(e.target.closest('[data-model-mic]')){toggleSpeech();return}const dot=e.target.closest('[data-dot]');if(dot)return;const go=e.target.closest('[data-go]');if(go){const r=go.dataset.go;if(r==='back')back();else if(r==='gallery')openFullGallery();else navigate(r,{model:go.dataset.model});return}const crmFilterBtn=e.target.closest('[data-crm-filter]');if(crmFilterBtn){crmFilter=crmFilterBtn.dataset.crmFilter;navigate('crm',{},false);return}const telegramBtn=e.target.closest('[data-crm-telegram]');if(telegramBtn){window.open('https://t.me/+'+String(orders[+telegramBtn.dataset.crmTelegram]?.phone||profileData.phone).replace(/\D/g,''),'_blank','noopener');return}const requestFilterBtn=e.target.closest('[data-request-filter]');if(requestFilterBtn){requestFilter=requestFilterBtn.dataset.requestFilter;navigate('requests',{},false);return}const f=e.target.closest('[data-filter]');if(f){filter=f.dataset.filter;const search=document.querySelector('#modelSearch');const query=search?.value||'';navigate('catalog',{},false);const newSearch=document.querySelector('#modelSearch');if(newSearch){newSearch.value=query;refreshModelResults()}return}const favBtn=e.target.closest('[data-fav]');if(favBtn){const k=favBtn.dataset.fav;fav.has(k)?fav.delete(k):fav.add(k);save();navigate(route,{},false);return}const full=e.target.closest('[data-full-gallery]');if(full){openFullGallery(+full.dataset.fullGallery);return}const zoom=e.target.closest('[data-zoom]');if(zoom&&route==='detail'){
 const photos=designPhotos();
 const index=Math.max(0,Math.min(photos.length-1,Number(zoom.dataset.zoom)||0));
 document.querySelector('.dd-design-preview')?.remove();
 const overlay=document.createElement('div');overlay.className='dd-design-preview';overlay.setAttribute('role','dialog');overlay.setAttribute('aria-modal','true');overlay.setAttribute('aria-label','Просмотр фотографии автомобиля');
 overlay.innerHTML=`<div class="dd-design-backdrop" data-preview-backdrop aria-label="Закрыть просмотр"></div><img src="${img(photos[index])}" alt="Hyundai ${cars[model][0]}, фото ${index+1}">`;
 document.querySelector('#app').append(overlay);
 const close=()=>{overlay.remove();document.removeEventListener('keydown',onKey)};
 const onKey=e=>{if(e.key==='Escape')close()};document.addEventListener('keydown',onKey);
 overlay.addEventListener('click',e=>{if(e.target===overlay||e.target.closest('[data-preview-backdrop]'))close()});
 return;
 }if(zoom){const images=model===0?elantraGallery:[cars[model][1]];let idx=+zoom.dataset.zoom;const overlay=document.createElement('div');overlay.className='demo-zoom';overlay.innerHTML=`<button data-zoom-close>Закрыть ×</button><img src="${img(images[idx])}" alt="Фото автомобиля"><div style="display:flex;gap:14px"><button data-zoom-prev>‹</button><button data-zoom-next>›</button></div>`;document.body.append(overlay);overlay.addEventListener('click',event=>{if(event.target.closest('[data-zoom-close]')||event.target===overlay){overlay.remove();return}if(event.target.closest('[data-zoom-prev],[data-zoom-next]')){idx=(idx+(event.target.closest('[data-zoom-next]')?1:-1)+images.length)%images.length;overlay.querySelector('img').src=img(images[idx]);}});return}const galleryKind=e.target.closest('[data-gallery-kind]');if(galleryKind){document.querySelectorAll('[data-gallery-kind]').forEach(x=>x.classList.toggle('sel',x===galleryKind));const kind=galleryKind.dataset.galleryKind;const images=model===0?(kind==='ext'?['elantra_ext1.jpg','elantra_ext2.jpg','elantra_ext3.jpg','elantra_ext4.jpg']:kind==='int'?['elantra_interior1.jpg','elantra_interior2.jpg','elantra_interior3.jpg']:elantraGallery):[cars[model][1]];document.querySelector('#galleryGrid').innerHTML=images.map((x,i)=>`<img data-zoom="${i}" src="${img(x)}" style="width:100%;border-radius:12px;margin:6px 0">`).join('');return}const tr=e.target.closest('[data-trim]');if(tr){navigate('trimDetail',{trim:tr.dataset.trim,model:tr.dataset.model});return}const orderOpen=e.target.closest('[data-order-open]');if(orderOpen){activeOrderIndex=+orderOpen.dataset.orderOpen;navigate('requestDetail');return}if(e.target.closest('[data-open-maps]')){openMapsSheet();return}const deleteOpen=e.target.closest('[data-open-delete]');if(deleteOpen){openDeleteSheet();return}const demo=e.target.closest('[data-demo]');if(demo){const r=demo.dataset.demo;if(r==='home'||r==='requests'||r==='favorites'||r==='profile')navigate(r);else if(['elantra','sonata','santafe','tucson'].includes(r))navigate('detail',{model:{elantra:0,sonata:1,santafe:3,tucson:4}[r]});else if(r==='catalog')navigate('testdrive');else if(r==='search')navigate('search');else if(r==='promo'||r==='media')navigate(r);else if(r==='banner')navigate('promo');}}
);
document.addEventListener('input',e=>{if(e.target.id==='modelSearch')refreshModelResults();if(e.target.matches('#demoForm textarea[name=comment]')){const counter=e.target.closest('.dd-form-section')?.querySelector('.dd-char-count');if(counter)counter.textContent=e.target.value.length+'/250'}});
document.addEventListener('change',e=>{if(e.target.id!=='ddAvatarInput')return;const file=e.target.files?.[0];if(!file)return;if(!file.type.startsWith('image/')){toast('Выберите изображение');return}if(file.size>12*1024*1024){toast('Размер фото не должен превышать 12 МБ');return}const reader=new FileReader();reader.onload=()=>{const image=new Image();image.onload=()=>{const canvas=document.createElement('canvas');canvas.width=256;canvas.height=256;const ctx=canvas.getContext('2d');const side=Math.min(image.width,image.height);ctx.drawImage(image,(image.width-side)/2,(image.height-side)/2,side,side,0,0,256,256);try{localStorage.setItem('dd_avatar',canvas.toDataURL('image/jpeg',.8));document.querySelectorAll('.dd-avatar-picker .dd-profile-avatar').forEach(el=>el.innerHTML=profileAvatar());toast('Фото профиля обновлено')}catch(_){toast('Не удалось сохранить фото')}};image.src=reader.result};reader.readAsDataURL(file)});
let edgeSwipe=null;document.getElementById('app').addEventListener('touchstart',e=>{const t=e.touches[0];edgeSwipe=t.clientX<=28&&!document.querySelector('.dd-full-gallery,.demo-zoom')&&route!=='home'?{x:t.clientX,y:t.clientY}:null},{passive:true});document.getElementById('app').addEventListener('touchend',e=>{if(!edgeSwipe)return;const t=e.changedTouches[0],dx=t.clientX-edgeSwipe.x,dy=t.clientY-edgeSwipe.y;edgeSwipe=null;if(dx>90&&Math.abs(dy)<dx*.55)back()},{passive:true});
document.addEventListener('submit',e=>{if(e.target.id!=='profileForm')return;e.preventDefault();const f=new FormData(e.target);profileData.name=String(f.get('name')||'').trim();profileData.phone=String(f.get('phone')||'').trim();profileData.email=String(f.get('email')||'').trim();localStorage.setItem('dd_profile',JSON.stringify(profileData));navigate('profile',{},false);toast('Профиль сохранён локально')});
document.addEventListener('change',e=>{if(e.target.id==='ddCity')ddSyncDealers();if(e.target.id==='ddDealer')ddSyncAddress();if(e.target.id==='ddCar')ddSyncTrims()});
document.addEventListener('submit',e=>{if(e.target.id!=='demoForm')return;e.preventDefault();const data=new FormData(e.target);orders.unshift({id:(crypto.randomUUID?.()||String(Date.now())),status:'processing',createdAt:new Date().toISOString(),kind:e.target.dataset.kind,car:cars[+data.get('car')][0],trim:String(data.get('trim')||'Style'),city:String(data.get('city')),dealer:String(data.get('dealer')),address:ddAddresses[String(data.get('dealer'))]||'',date:String(data.get('date')||''),time:String(data.get('time')||''),name:String(data.get('name')),phone:String(data.get('phone')),comment:String(data.get('comment')||''),created:new Date().toLocaleDateString('ru-RU',{day:'numeric',month:'short',year:'numeric'})});save();navigate('requestSuccess')});
})();
</script></body></html>
